name: Verify reader
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions (isolated fixtures)
        env:
          APP_URL: http://127.0.0.1:3001
          BROWSER_CHANNEL: chromium
        run: |
          node node_modules/next/dist/bin/next start -p 3001 > /tmp/signal-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001 > /dev/null; then break; fi
            sleep 1
          done
          node tests/library-browser.mjs
          node tests/browser-smoke.mjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-browser-evidence
          path: |
            /tmp/gcdsignal-*-qa.png
            /tmp/signal-server.log
          if-no-files-found: ignore
