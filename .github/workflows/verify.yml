name: Verify reader
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions (isolated fixtures)
        env:
          APP_URL: http://127.0.0.1:3001
          BROWSER_CHANNEL: chromium
        run: |
          node node_modules/next/dist/bin/next start -p 3001 > /tmp/signal-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001 > /dev/null; then break; fi
            sleep 1
          done
          node tests/library-browser.mjs
          node tests/browser-smoke.mjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-browser-evidence
          path: |
            /tmp/gcdsignal-*-qa.png
            /tmp/signal-server.log
          if-no-files-found: ignore
