name: keep-warm

# Re-fetch the default deck every 5 minutes so visitors never hit a cold
# cache (~1.8s). Needs the repo secret CRON_SECRET (same value as on Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm production caches
        run: |
          curl -sS -m 55 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://gcdsignal.vercel.app/api/warm" | head -c 2000
