name: keep-warm

# Best-effort warm-up of Brief and default Deck caches every five minutes.
# Scheduling and upstream availability are not guaranteed. Needs CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm production caches
        env:
          SIGNAL_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -o pipefail
          curl --fail-with-body -sS -m 55 \
            -H "Authorization: Bearer $SIGNAL_CRON_SECRET" \
            "https://gcdsignal.vercel.app/api/warm" | tee /tmp/signal-warm.json
          jq -e '.ok == true' /tmp/signal-warm.json
